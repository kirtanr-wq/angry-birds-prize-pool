<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CodeBounty 2.0 | Prize Pool</title>

    <link rel="stylesheet" href="prize.css">
</head>

<body>

    <section class="prize-page">


        <!-- =====================================
             THREE STARS
        ====================================== -->

        <div class="stars">

            <img
                src="assets/star-left.png"
                alt=""
                class="star star-left"
            >

            <img
                src="assets/star-centre.png"
                alt=""
                class="star star-centre"
            >

            <img
                src="assets/star-right.png"
                alt=""
                class="star star-right"
            >

        </div>



        <!-- =====================================
             PRIZE BOARD
        ====================================== -->

        <div class="board-wrapper">

            <img
                src="assets/prize-board.png"
                alt=""
                class="prize-board"
            >

            <div class="board-content">

                <span class="board-title">
                    PRIZE POOL
                </span>

                <strong class="board-amount">
                    ₹7,000
                </strong>

            </div>

        </div>



        <!-- =====================================
             CHARACTERS
        ====================================== -->

        <div class="characters-wrapper">

            <img
                src="assets/prize-characters.png"
                alt="Angry Birds Characters"
                class="prize-characters"
            >

        </div>


    </section>


    <script src="prize.js"></script>

</body>

</html>
